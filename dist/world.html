<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晴笺 · AI 小说创作台 — 设定库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23E89B54'/%3E%3Cpath d='M12 5v14M5 12h14' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .world-shell { display: grid; grid-template-columns: 170px 1fr 300px; gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .world-shell { grid-template-columns: 160px 1fr; } .world-detail { grid-column: 1 / -1; } }
  @media (max-width: 760px) { .world-shell { grid-template-columns: 1fr; } }
  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .plain-card { background: var(--paper); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow-card); cursor: pointer; transition: transform .16s; }
  .plain-card:hover { transform: translateY(-2px); }
</style>
</head>
<body data-page="world">

<header class="app-topbar" id="app-topbar"></header>

<main class="page-wrap">
  <div class="flex-between mb-14">
    <h2 class="section-title"><span class="dot"></span>设定库 <span class="tag tag-mute" style="margin-left:6px" id="proj-tag">—</span></h2>
    <div class="flex gap-6">
      <button class="btn btn-soft" id="btn-ai-gen">AI 生成设定</button>
      <button class="btn btn-ghost" id="btn-add">＋ 新建</button>
    </div>
  </div>

  <div class="world-shell">

    <!-- 左：类型 -->
    <aside class="card card-pad" style="padding:10px">
      <div class="world-tabs" id="world-tabs">
        <div class="world-tab active" data-t="chars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>人物 <span class="mono" style="margin-left:auto;font-size:11px">4</span></div>
        <div class="world-tab" data-t="loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>地点 <span class="mono" style="margin-left:auto;font-size:11px">3</span></div>
        <div class="world-tab" data-t="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>物品 <span class="mono" style="margin-left:auto;font-size:11px">2</span></div>
        <div class="world-tab" data-t="fs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 .6-.9A4 4 0 0 1 7 2c2 0 3 1 5 1s3-1 5-1a4 4 0 0 1 2.4.6A1 1 0 0 1 20 3v11a1 1 0 0 1-.6.9A4 4 0 0 1 17 16c-2 0-3-1-5-1s-3 1-5 1a4 4 0 0 1-2.4-1.1A1 1 0 0 1 4 14z"/></svg>伏笔 <span class="mono" style="margin-left:auto;font-size:11px">6</span></div>
        <div class="world-tab" data-t="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 8.4v7.2M18 9.6c0 2-1.4 3.6-3.4 4.2L6 17"/></svg>时间线</div>
      </div>
    </aside>

    <!-- 中：卡片网格 -->
    <section>
      <div class="flex-between mb-14">
        <span class="eyebrow" id="wt-title">人物设定</span>
        <span class="small muted" id="wt-count">4 条记录</span>
      </div>
      <div id="wt-grid" class="char-grid"></div>
    </section>

    <!-- 右：详情 -->
    <aside class="world-detail">
      <div class="detail-pane" id="wt-detail"></div>
    </aside>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/world.js"></script>
</body>
</html>
