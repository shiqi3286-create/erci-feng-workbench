name: Build Windows Desktop App

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm install
      - name: Diagnose Tauri project
        continue-on-error: true
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          npm run tauri info
          cargo check --manifest-path src-tauri/Cargo.toml --message-format short
      - name: Build Tauri app
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "tauri-build.log"
          & npm run tauri build 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = Get-Content $log | Select-Object -Last 120
            "## Tauri build failure`n````text`n$($tail -join "`n")`n````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Output "===== Tauri build failure (last 120 lines) ====="
            $tail | Write-Output
            exit $code
          }
        uses: actions/upload-artifact@v4
        with:
          name: erci-feng-workbench-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
