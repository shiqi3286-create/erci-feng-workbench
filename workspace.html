<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晴笺 · AI 小说创作台 — 创作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23E89B54'/%3E%3Cpath d='M12 5v14M5 12h14' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/theme-layout.css">
<link rel="stylesheet" href="assets/css/theme-night.css">
</head>
<body data-page="workspace">

<header class="app-topbar" id="app-topbar"></header>
<div class="app-toolbar" id="app-toolbar"></div>

<div class="workspace-shell">

  <!-- ============ 左栏：资源树 ============ -->
  <aside class="side-panel">
    <div class="side-tabs" id="side-tabs">
      <button class="side-tab active" data-tab="outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>大纲</button>
      <button class="side-tab" data-tab="chars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>人物</button>
      <button class="side-tab" data-tab="fs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 .6-.9A4 4 0 0 1 7 2c2 0 3 1 5 1s3-1 5-1a4 4 0 0 1 2.4.6A1 1 0 0 1 20 3v11a1 1 0 0 1-.6.9A4 4 0 0 1 17 16c-2 0-3-1-5-1s-3 1-5 1a4 4 0 0 1-2.4-1.1A1 1 0 0 1 4 14z"/></svg>伏笔</button>
      <button class="side-tab" data-tab="tpl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2.4"/><circle cx="9" cy="16" r="2.4"/></svg>模板</button>
    </div>
    <div class="side-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="input" id="side-search-input" placeholder="搜索章节 / 设定…">
    </div>
    <div class="side-body" id="side-body"></div>
  </aside>

  <!-- ============ 中栏：轨迹 + 正文 + 指令 ============ -->
  <main class="workspace-main">
    <div class="trace-bar">
      <div class="trace-flow" id="trace-flow"></div>
    </div>

    <div class="doc-area" id="doc-area"></div>

    <div class="cmd-bar">
      <div class="cmd-quick" id="cmd-quick">
        <button class="chip" data-action="续写">✎ 续写</button>
        <button class="chip" data-action="扩写">＋ 扩写</button>
        <button class="chip" data-action="润色">⌾ 润色</button>
        <button class="chip" data-action="对话">💬 生成对话</button>
        <button class="chip" data-action="人设检查">✓ 人设检查</button>
        <button class="chip" data-action="伏笔扫描">⚑ 伏笔扫描</button>
        <button class="chip" data-action="插图">🖼 插图</button>
      </div>
      <div class="cmd-row">
        <textarea class="textarea" id="cmd-input" placeholder="告诉 AI 想写什么… 例如：继续写灯火熄灭后凛的反应，注意陆沉的口吻" rows="1"></textarea>
        <button class="send-btn" id="cmd-send" title="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
      </div>
      <div class="cmd-foot">
        <span id="cmd-hint">选中文本或输入指令，AI 只会把选中的内容发送给模型</span>
        <span class="tokens"><span>上下文 <b class="mono" id="tk-num">3.9k</b>/16k</span><span class="tk-bar"><i id="tk-fill" style="width:24%"></i></span></span>
      </div>
    </div>

    <div class="status-bar">
      <span id="save-state"><span class="save-dot" id="save-dot"></span> 已保存</span>
      <span>本章 <b class="mono" id="st-words">5,230</b> 字</span>
      <span>修改 <b class="mono" id="st-mod">3</b> 次</span>
      <span class="conflict" id="st-conflict">⚑ 待回收伏笔 <b class="mono">0</b></span>
      <button class="chip" style="padding:3px 12px;font-size:11px" id="btn-scan-here" title="用本地规则扫描本章一致性（不消耗 AI 额度）">本地校验·本章</button>
      <button class="chip" style="padding:3px 12px;font-size:11px" id="btn-scan-all" title="扫描全书人名/名词/伏笔一致性（不消耗 AI 额度）">校验·全书</button>
      <span class="spacer"></span>
      <button class="chip" style="padding:3px 12px;font-size:11px" id="btn-save" title="Ctrl+S">保存</button>
      <span>全屏专注 <button class="chip" style="padding:2px 10px;font-size:11px" id="btn-focus">开启</button></span>
    </div>
  </main>

  <!-- ============ 右栏：上下文面板 ============ -->
  <aside class="workspace-context">
    <div class="context-panel">
      <div class="ctx-tabs" id="ctx-tabs">
        <button class="ctx-tab active" data-tab="beat">本章小纲</button>
        <button class="ctx-tab" data-tab="chars">人物</button>
        <button class="ctx-tab" data-tab="fs">伏笔</button>
        <button class="ctx-tab" data-tab="sug">建议</button>
        <button class="ctx-tab" data-tab="ctx">上下文</button>
      </div>
      <div class="ctx-body" id="ctx-body"></div>
    </div>
  </aside>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/updater.js"></script>
<script src="assets/js/workspace.js"></script>
</body>
</html>
