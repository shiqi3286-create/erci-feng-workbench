<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晴笺 · AI 小说创作台 — 模板 · API</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23E89B54'/%3E%3Cpath d='M12 5v14M5 12h14' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/theme-layout.css">
<link rel="stylesheet" href="assets/css/theme-night.css">
<style>
  .tpl-shell { display: grid; grid-template-columns: 1fr 400px; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .tpl-shell { grid-template-columns: 1fr; } }
</style>
</head>
<body data-page="template">

<header class="app-topbar" id="app-topbar"></header>
<div class="app-toolbar" id="app-toolbar"></div>

<main class="page-wrap">

  <!-- 提示词模板 -->
  <div class="flex-between mb-14">
    <h2 class="section-title"><span class="dot"></span>提示词模板 <span class="tag tag-mute" style="margin-left:6px" id="tpl-count">9 个模板 · 3 组</span></h2>
    <div class="flex gap-6">
      <button class="btn btn-soft" id="btn-add-tpl">＋ 新建模板</button>
      <button class="btn btn-ghost" id="btn-export-tpl">导出</button>
      <button class="btn btn-ghost" id="btn-import-tpl">导入</button>
      <input type="file" id="tpl-file" accept="application/json,.json" style="display:none">
    </div>
  </div>

  <div class="tpl-shell mb-20">
    <!-- 左：模板分组列表 -->
    <section id="tpl-groups"></section>
    <!-- 右：模板编辑 -->
    <aside class="detail-pane" id="tpl-detail"></aside>
  </div>

  <!-- API 渠道：左列表（写作/画图分组） + 右内联编辑面板 -->
  <div class="flex-between mb-14">
    <h2 class="section-title"><span class="dot"></span>API 渠道 <span class="tag tag-mint" style="margin-left:6px" id="api-count">0 / 0 可用</span></h2>
    <div class="flex gap-6">
      <button class="btn btn-soft" id="btn-add-api-text">＋ 写作渠道</button>
      <button class="btn btn-soft" id="btn-add-api-image">＋ 画图渠道</button>
    </div>
  </div>

  <div class="tpl-shell mb-20">
    <section id="api-list"></section>
    <aside class="detail-pane" id="api-editor"></aside>
  </div>

  <div class="card card-pad mt-20" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div style="flex:1;min-width:220px">
      <div class="eyebrow" style="margin-bottom:4px">安全策略</div>
      <div style="font-size:13px;color:var(--ink-soft)">AI 请求只会发送你手动选中的文本 + 设定卡片，全书文稿默认留在本地，不会自动上传。</div>
    </div>
    <div class="flex gap-6">
      <span class="small muted">默认关闭 AI 自动发送</span>
      <span class="switch on" id="ai-switch"></span>
    </div>
  </div>

  <div class="card card-pad mt-20" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div style="flex:1;min-width:220px">
      <div class="eyebrow" style="margin-bottom:4px">版本与更新</div>
      <div style="font-size:13px;color:var(--ink-soft)">当前版本 <b class="mono" id="app-version">…</b> · 检查到新版后跳转 GitHub 发布页手动下载安装。</div>
    </div>
    <div class="flex gap-6">
      <button class="btn btn-ghost" id="btn-open-releases">发布页</button>
      <button class="btn btn-soft" id="btn-check-update">检查更新</button>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/updater.js"></script>
<script src="assets/js/template.js"></script>
</body>
</html>
